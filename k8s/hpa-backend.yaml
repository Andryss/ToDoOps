# HorizontalPodAutoscaler for backend: scale on CPU > 15% (min 1, max 5 replicas).
# Requires backend Deployment to have resources.requests.cpu set (e.g. 100m).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: todoops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 35
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      # Add only 1 pod per minute
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
