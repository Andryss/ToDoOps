# --- Frontend Deployment: Nginx serving static app; proxy /api/v1 to backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: todoops
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: andryss/todoops-frontend:latest
          ports:
            - containerPort: 8080
          env:
            # Same namespace Service as backend (matches Service selector app=backend for Prometheus)
            - name: BACKEND_URL
              value: "http://backend.todoops.svc.cluster.local:8080"
            - name: API_LOCATION
              value: "/api/v1"
---
# --- Frontend Service: internal DNS name "frontend"; optional type: LoadBalancer for external access.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: todoops
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
