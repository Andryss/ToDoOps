---
# Install Docker Engine and Compose v2 (Ubuntu), sysctl for SonarQube. Run: ansible-playbook install-docker.yml -e @vars.yml

- name: Install Docker and host tuning for SonarQube VM
  hosts: sonarqube
  become: true
  tasks:
    - name: Persist vm.max_map_count for Elasticsearch (bundled in SonarQube)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-sonarqube.conf
        content: |
          vm.max_map_count=262144
        mode: "0644"

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Install Docker and docker-compose-v2
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add {{ ansible_user }} to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
