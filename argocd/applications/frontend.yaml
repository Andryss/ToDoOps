# Syncs k8s/frontend.yaml (Deployment + Service).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todoops-frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Andryss/ToDoOps.git
    targetRevision: HEAD
    path: k8s
    directory:
      include: frontend.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: todoops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
