# ingress-nginx controller (Helm) + k8s/ingress.yaml. Matches k8s/README.md §3.
# Argo CD ≥ 2.6 (spec.sources). IngressClass name "nginx" is created by the chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todoops-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: "4.11.3"
      helm:
        releaseName: ingress-nginx
        values: |
          controller:
            service:
              type: LoadBalancer
            scope:
              enabled: true
              namespace: todoops
    - repoURL: https://github.com/Andryss/ToDoOps.git
      targetRevision: HEAD
      path: k8s
      directory:
        include: ingress.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: todoops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
