# Syncs only k8s/postgres.yaml into namespace todoops (Headless Service + StatefulSet).
# Prerequisite: Secret todoops-secrets with POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
# (see ../README.md § Secrets and this Application). Argo CD does not create that Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todoops-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Andryss/ToDoOps.git
    targetRevision: HEAD
    path: k8s
    directory:
      include: postgres.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: todoops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
